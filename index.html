<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suraj Trading Tracker</title>
<style>
:root{--bg:#0a0d16;--card:#131827;--line:#222b40;--tx:#eef1f8;--mu:#8b93a8;--g:#19e3a0;--r:#ff5c7a;--b:#4da3ff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 84px)}
h1{font-size:18px;letter-spacing:.5px}h1 span{color:var(--g)}
.sub{font-size:12px;color:var(--mu);margin:2px 0 12px}
.hero{background:linear-gradient(135deg,#16203a,#101828);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.lbl{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
.big{font-size:40px;font-weight:700;margin:2px 0 6px}
.pos{color:var(--g)}.neg{color:var(--r)}
.row{display:flex;gap:18px;font-size:13px;color:var(--mu)}.row b{color:var(--tx)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.g2 .card{margin:0}
.kv{font-size:22px;font-weight:700;margin-top:4px}.note{font-size:11px;color:var(--mu);margin-top:2px}
h2{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
svg{width:100%;height:auto;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mu);border-radius:99px;padding:6px 14px;font-size:13px}
.chip.on{background:var(--g);color:#06231a;border-color:var(--g);font-weight:600}
.donut{width:120px;height:120px;border-radius:50%;flex:none;position:relative}
.donut:after{content:"";position:absolute;inset:22px;background:var(--card);border-radius:50%}
.flex{display:flex;align-items:center;gap:16px;font-size:13px;line-height:2}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:10px}
input,select{width:100%;margin-top:4px;background:#0d1220;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:11px;font-size:16px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:linear-gradient(90deg,var(--g),var(--b));color:#06231a}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--r);margin-top:10px;font-weight:500;font-size:14px}
.tr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.tr:last-child{border:0}.tr small{display:block;color:var(--mu);font-size:11px}
.res{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px}
.res.pos{background:rgba(25,227,160,.12)}.res.neg{background:rgba(255,92,122,.12)}.res.mu{background:#222b40;color:var(--mu)}
.x{background:none;border:0;color:var(--mu);font-size:20px;padding:4px 8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0d1220;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:12px 0;font-size:12px}
nav button.on{color:var(--g);font-weight:700}nav b{display:block;font-size:20px;font-weight:400}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translateX(-50%);background:var(--g);color:#06231a;padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:30px 0;font-size:14px}
</style></head><body>
<h1><span>SURAJ</span> TRADING TRACKER</h1><div class="sub" id="sub"></div>
<main id="app"></main>
<nav><button data-t="dash"><b>📊</b>Dashboard</button><button data-t="add"><b>➕</b>Add Trade</button><button data-t="log"><b>📒</b>Trades</button></nav>
<script>
const KEY='sj_trades_v1';
const seed=[[ '2026-10-05','09:27',134.95,129.3,150.5,150.5],['2026-10-05','10:38',400.26,112.25,342.1,342.1],['2026-10-06','09:27',134.95,129.3,150.5,150.5],['2026-10-06','10:38',119.05,112.25,342.1,342.1],['2026-10-07','09:27',134.95,129.3,150.5,150.5],['2026-10-07','10:38',119.05,112.25,342.1,342.1],['2026-10-07','10:48',250.05,245.25,342.1,342.1]]
.map((a,i)=>({id:i+1,script:'Nifty50',date:a[0],time:a[1],act:'BUY',qty:65,entry:a[2],sl:a[3],target:a[4],exit:a[5]}));
let T;try{T=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(T)){T=seed;save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(T))}catch(e){}}
let tab='dash',mon='ALL';
const $=s=>document.querySelector(s);
const f=n=>(n<0?'-':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const r2=n=>Math.round(n*100)/100;
function calc(t){const F=+t.qty,G=+t.entry,J=+t.exit,H=t.sl===''||t.sl==null?NaN:+t.sl;let res,pts,rr='';
 if(t.act==='BUY'){res=J>G?'PROFIT':J<G?'LOSS':'CTC';pts=J-G;if(!isNaN(H)&&G!==H)rr='1 : '+r2(pts/(G-H))}
 else{res=J<G?'PROFIT':J>G?'LOSS':'CTC';pts=G-J;if(!isNaN(H)&&G!==H)rr='1 : '+r2(pts/(H-G))}
 return{res,pts:r2(pts),rr,pl:r2(F*pts)}}
const dd=s=>new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
const mname=m=>new Date(m+'-01T00:00:00').toLocaleDateString('en-IN',{month:'short',year:'numeric'});
function line(v){if(!v.length)return'';const w=340,h=170,p=22,mn=Math.min(0,...v),mx=Math.max(0,...v);
 const x=i=>p+(v.length<2?(w-2*p)/2:i*(w-2*p)/(v.length-1)),y=a=>h-p-(a-mn)/((mx-mn)||1)*(h-2*p);
 const pt=v.map((a,i)=>x(i)+','+y(a)).join(' ');
 return `<svg viewBox="0 0 ${w} ${h}"><line x1="${p}" x2="${w-p}" y1="${y(0)}" y2="${y(0)}" stroke="#222b40"/><polygon points="${x(0)},${y(0)} ${pt} ${x(v.length-1)},${y(0)}" fill="rgba(25,227,160,.18)"/><polyline points="${pt}" fill="none" stroke="#19e3a0" stroke-width="3" stroke-linejoin="round"/>${v.map((a,i)=>`<circle cx="${x(i)}" cy="${y(a)}" r="3.5" fill="#19e3a0"/>`).join('')}<text x="${p}" y="12" fill="#8b93a8" font-size="10">${f(mx)}</text><text x="${p}" y="${h-4}" fill="#8b93a8" font-size="10">${f(mn)}</text></svg>`}
function bars(l,v){if(!v.length)return'';const w=340,h=170,p=22,mx=Math.max(1,...v.map(Math.abs)),bw=Math.min(40,(w-2*p)/v.length-8),z=h/2-4;
 return `<svg viewBox="0 0 ${w} ${h}"><line x1="${p}" x2="${w-p}" y1="${z}" y2="${z}" stroke="#222b40"/>${v.map((a,i)=>{const cx=p+(i+.5)*(w-2*p)/v.length,bh=Math.abs(a)/mx*(z-18);return `<rect x="${cx-bw/2}" y="${a>=0?z-bh:z}" width="${bw}" height="${Math.max(bh,2)}" rx="4" fill="${a>=0?'#19e3a0':'#ff5c7a'}"/><text x="${cx}" y="${a>=0?z-bh-4:z+bh+12}" fill="#eef1f8" font-size="10" text-anchor="middle">${(a/1000).toFixed(1)}k</text><text x="${cx}" y="${h-4}" fill="#8b93a8" font-size="10" text-anchor="middle">${l[i]}</text>`}).join('')}</svg>`}
function view(){return T.filter(t=>mon==='ALL'||t.date.slice(0,7)===mon).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
function dash(){const D=view().map(t=>({...t,...calc(t)})),months=[...new Set(T.map(t=>t.date.slice(0,7)))].sort();
 let h=`<div class="chips"><button class="chip ${mon==='ALL'?'on':''}" data-m="ALL">All</button>${months.map(m=>`<button class="chip ${mon===m?'on':''}" data-m="${m}">${mname(m)}</button>`).join('')}</div>`;
 if(!D.length)return h+'<div class="empty">Abhi koi trade nahi hai.<br>"Add Trade" se pehla trade daalo.</div>';
 const pl=D.map(t=>t.pl),net=pl.reduce((a,b)=>a+b,0),pts=D.reduce((a,t)=>a+t.pts,0);
 const W=D.filter(t=>t.res==='PROFIT').length,L=D.filter(t=>t.res==='LOSS').length,C=D.length-W-L;
 const gp=pl.filter(v=>v>0).reduce((a,b)=>a+b,0),gl=-pl.filter(v=>v<0).reduce((a,b)=>a+b,0);
 const days=[...new Set(D.map(t=>t.date))],dp=days.map(d=>D.filter(t=>t.date===d).reduce((a,t)=>a+t.pl,0));
 let s=0;const cum=pl.map(v=>s+=v);const wr=W/D.length*100;
 const a=W/D.length*360,b=a+L/D.length*360;
 return h+`<div class="hero"><div class="lbl">Net Profit / Loss</div><div class="big ${net>=0?'pos':'neg'}">${net>0?'+':''}${f(net)}</div><div class="row"><span>Points <b>${pts>0?'+':''}${r2(pts)}</b></span><span>Avg/trade <b>${f(net/D.length)}</b></span></div></div>
 <div class="g2"><div class="card"><div class="lbl">Win rate</div><div class="kv">${wr.toFixed(1)}%</div><div class="note">${W}W · ${L}L · ${C} CTC</div></div>
 <div class="card"><div class="lbl">Profit factor</div><div class="kv">${gl?(gp/gl).toFixed(2):'∞'}</div><div class="note">${D.length} trades</div></div>
 <div class="card"><div class="lbl">Best trade</div><div class="kv pos">${f(Math.max(...pl))}</div></div>
 <div class="card"><div class="lbl">Worst trade</div><div class="kv neg">${f(Math.min(...pl))}</div></div></div>
 <div class="card"><h2>Equity curve</h2>${line(cum)}</div>
 <div class="card"><h2>Daily P/L</h2>${bars(days.map(dd),dp)}</div>
 <div class="card"><h2>Win / Loss split</h2><div class="flex"><div class="donut" style="background:conic-gradient(#19e3a0 0 ${a}deg,#ff5c7a ${a}deg ${b}deg,#8b93a8 ${b}deg 360deg)"></div><div><div><i class="dot" style="background:#19e3a0"></i>Wins ${W}</div><div><i class="dot" style="background:#ff5c7a"></i>Losses ${L}</div><div><i class="dot" style="background:#8b93a8"></i>CTC ${C}</div></div></div></div>`}
function add(){const today=new Date().toISOString().slice(0,10);
 return `<div class="card"><h2>Naya trade</h2>
 <label>Script<select id="script"><option>Nifty50</option><option>Sensex</option></select></label>
 <div class="f2"><label>Date<input id="date" type="date" value="${today}"></label><label>Time<input id="time" type="time" value="09:30"></label></div>
 <div class="f2"><label>Action<select id="act"><option>BUY</option><option>SELL</option></select></label><label>Quantity<input id="qty" type="number" inputmode="decimal" value="65"></label></div>
 <div class="f2"><label>Entry Price<input id="entry" type="number" inputmode="decimal" step="any"></label><label>Exit Price<input id="exit" type="number" inputmode="decimal" step="any"></label></div>
 <div class="f2"><label>Stoploss<input id="sl" type="number" inputmode="decimal" step="any"></label><label>Target<input id="target" type="number" inputmode="decimal" step="any"></label></div>
 <button class="btn" id="save">Save Trade</button></div>
 <div class="note" style="text-align:center">R:R, Result, Points aur P/L apne aap nikalenge.</div>`}
function log(){const D=view().map(t=>({...t,...calc(t)})).reverse();
 return `<div class="card"><h2>Saare trades (${D.length})</h2>${D.length?D.map(t=>`<div class="tr"><div>${t.script} · ${t.act}<span class="res ${t.res==='PROFIT'?'pos':t.res==='LOSS'?'neg':'mu'}">${t.res}</span><small>${dd(t.date)} ${t.time} · ${t.qty} qty · ${t.entry} → ${t.exit}${t.rr?' · R:R '+t.rr:''}</small></div><div style="text-align:right"><b class="${t.pl>=0?'pos':'neg'}">${t.pl>0?'+':''}${f(t.pl)}</b></div><button class="x" data-d="${t.id}">✕</button></div>`).join(''):'<div class="empty">Koi trade nahi.</div>'}</div><button class="btn ghost" id="clr">Saara data delete karo</button>`}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function render(){const m=new Set(T.map(t=>t.date));
 $('#sub').textContent=T.length+' trades saved on this phone';
 $('#app').innerHTML=tab==='dash'?dash():tab==='add'?add():log();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mon=b.dataset.m;render()});
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Ye trade delete karein?')){T=T.filter(t=>t.id!=b.dataset.d);save();render()}});
 const c=$('#clr');if(c)c.onclick=()=>{if(confirm('Saare trades delete ho jayenge. Pakka?')){T=[];save();render()}};
 const sv=$('#save');if(sv)sv.onclick=()=>{const g=i=>$('#'+i).value.trim();
  if(!g('date')||g('qty')===''||g('entry')===''||g('exit')===''){toast('Date, Qty, Entry, Exit bharo');return}
  T.push({id:Date.now(),script:g('script'),date:g('date'),time:g('time'),act:g('act'),qty:+g('qty'),entry:+g('entry'),sl:g('sl'),target:g('target'),exit:+g('exit')});
  save();tab='dash';mon='ALL';render();toast('Trade save ho gaya')}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
render();
</script></body></html>
